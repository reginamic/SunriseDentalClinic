name: Sunrise Dental CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Java Web Applications
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"

      - name: Install Apache Ant
        shell: pwsh
        run: |
          $antVersion = "1.10.16"
          $antZip = "$env:RUNNER_TEMP\apache-ant.zip"
          $antHome = "$env:RUNNER_TEMP\apache-ant-$antVersion"

          Invoke-WebRequest `
            -Uri "https://archive.apache.org/dist/ant/binaries/apache-ant-$antVersion-bin.zip" `
            -OutFile $antZip

          Expand-Archive -Path $antZip -DestinationPath $env:RUNNER_TEMP

          "ANT_HOME=$antHome" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

          "$antHome\bin" | Out-File `
            -FilePath $env:GITHUB_PATH -Append

      - name: Install Apache Tomcat build environment
        shell: pwsh
        run: |
          $tomcatVersion = "10.1.57"
          $tomcatZip = "$env:RUNNER_TEMP\apache-tomcat.zip"
          $tomcatHome = "$env:RUNNER_TEMP\apache-tomcat-$tomcatVersion"

          Invoke-WebRequest `
            -Uri "https://archive.apache.org/dist/tomcat/tomcat-10/v$tomcatVersion/bin/apache-tomcat-$tomcatVersion.zip" `
            -OutFile $tomcatZip

          Expand-Archive -Path $tomcatZip -DestinationPath $env:RUNNER_TEMP

          "TOMCAT_HOME=$tomcatHome" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

      - name: Install NetBeans CopyLibs build task
        shell: pwsh
        run: |
          $netBeansVersion = "25"
          $netBeansZip = "$env:RUNNER_TEMP\netbeans-$netBeansVersion-bin.zip"

          Invoke-WebRequest `
            -Uri "https://archive.apache.org/dist/netbeans/netbeans/$netBeansVersion/netbeans-$netBeansVersion-bin.zip" `
            -OutFile $netBeansZip

          Expand-Archive `
            -Path $netBeansZip `
            -DestinationPath $env:RUNNER_TEMP

          $copyLibsJar = `
            "$env:RUNNER_TEMP\netbeans\java\ant\extra\org-netbeans-modules-java-j2seproject-copylibstask.jar"

          if (-not (Test-Path $copyLibsJar)) {
              throw "NetBeans CopyLibs task was not found."
          }

          "COPYLIBS_JAR=$copyLibsJar" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

      - name: Provision project dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "lib"

          Invoke-WebRequest `
            -Uri "https://repo1.maven.org/maven2/com/google/code/gson/gson/2.14.0/gson-2.14.0.jar" `
            -OutFile "lib\gson-2.14.0.jar"

          Invoke-WebRequest `
            -Uri "https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/26.7.0/mysql-connector-j-26.7.0.jar" `
            -OutFile "lib\mysql-connector-j-26.7.0.jar"

      - name: Verify CI toolchain
        shell: pwsh
        run: |
          java -version
          ant -version
          Write-Host "Tomcat Home: $env:TOMCAT_HOME"
          Write-Host "CopyLibs: $env:COPYLIBS_JAR"

          if (-not (Test-Path $env:COPYLIBS_JAR)) {
              throw "CopyLibs dependency is unavailable."
          }

          Get-ChildItem "lib"

      - name: Clean and build REST API
        shell: pwsh
        run: |
          ant `
            -f "sunrise-dental-api\build.xml" `
            "-Dj2ee.server.home=$env:TOMCAT_HOME" `
            "-Dlibs.CopyLibs.classpath=$env:COPYLIBS_JAR" `
            clean dist

      - name: Clean and build Web application
        shell: pwsh
        run: |
          ant `
            -f "sunrise-dental-web\build.xml" `
            "-Dj2ee.server.home=$env:TOMCAT_HOME" `
            "-Dlibs.CopyLibs.classpath=$env:COPYLIBS_JAR" `
            clean dist

      - name: Verify deployment packages
        shell: pwsh
        run: |
          if (-not (Test-Path "sunrise-dental-api\dist\sunrise-dental-api.war")) {
              throw "REST API WAR was not generated."
          }

          if (-not (Test-Path "sunrise-dental-web\dist\sunrise-dental-web.war")) {
              throw "Web application WAR was not generated."
          }

          Get-Item "sunrise-dental-api\dist\sunrise-dental-api.war"
          Get-Item "sunrise-dental-web\dist\sunrise-dental-web.war"

      - name: Upload deployable WAR packages
        uses: actions/upload-artifact@v6
        with:
          name: sunrise-dental-war-packages
          path: |
            sunrise-dental-api/dist/sunrise-dental-api.war
            sunrise-dental-web/dist/sunrise-dental-web.war
          if-no-files-found: error
          retention-days: 14